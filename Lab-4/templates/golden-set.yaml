# Golden set v1 · [your product] · Week 4
# Copy to evals/golden.yaml. Five questions FROM YOUR OWN CORPUS.
# Composition for Week 4: 2 factual, 1 reasoning, 1 edge case, 1 refusal.
# Week 11 grows this to 10: 3 factual, 2 reasoning, 2 edge, 2 refusal, 1 format.
#
# expect        answered | refused
# must_cite     document ids (path under data/corpus, without .md) that MUST be among the cited sources
# must_mention  short, exact phrases that MUST appear in the answer (case-insensitive)
# why           one line: what this question protects
#
# Rules: never weaken or delete a question to make a run pass. Fix the pipeline, or
# write down why the question was wrong in a decision record.
# Full example: Lab-4/examples/campuspulse-rag/evals/golden.yaml

threshold: 0.70

items:
  - id: g1
    type: factual
    question: "[a question with one clear answer in one document]"
    expect: answered
    must_cite: [folder/document]
    must_mention: [exact phrase]
    why: "[what breaks for a user if this is wrong]"

  - id: g2
    type: factual
    question: "[a question whose answer contains a number, a date or a name]"
    expect: answered
    must_cite: [folder/document]
    must_mention: [the number, date or name]
    why: "[...]"

  - id: g3
    type: reasoning
    question: "[a question that needs two documents together]"
    expect: answered
    must_cite: [folder/document-a, folder/document-b]
    must_mention: [exact phrase]
    why: "[...]"

  - id: g4
    type: edge
    question: "[the way a real user types it: a typo, no punctuation, a vague phrase]"
    expect: answered
    must_cite: [folder/document]
    must_mention: [exact phrase]
    why: "[...]"

  - id: g5
    type: refusal
    question: "[something users will ask that your documents do not answer]"
    expect: refused
    must_cite: []
    must_mention: []
    why: "[the confident wrong answer this protects against]"
